name: CI

# The check a pull request can show before it is merged. The steps mirror the
# Makefile entry points one to one: formatting, vet and the shell's syntax check,
# then the unit and acceptance suites, then the build entry that writes the
# installable artifact.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format, vet and shell syntax
        run: make lint

      - name: Unit and acceptance tests
        run: make test

      - name: Build the extension package
        run: make package
